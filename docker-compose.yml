services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trainee-knowledge-assistant
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - NUXT_PUBLIC_APP_URL=${NUXT_PUBLIC_APP_URL:-http://localhost:3001}
      - NUXT_DATABASE_PATH=/app/data/app.db
      - NUXT_STORAGE_DIR=/app/storage
      - NUXT_CORS_ORIGINS=${NUXT_CORS_ORIGINS:-http://localhost:3001}
      # The following are loaded from .env via env_file
      # NUXT_ZAI_API_KEY
      # NUXT_ZAI_API_BASE
      # NUXT_PRIMARY_MODEL
      # NUXT_PRIMARY_MODEL_DISPLAY_NAME
      # NUXT_OPENROUTER_API_KEY
      # NUXT_OPENROUTER_API_BASE
      # NUXT_FALLBACK_MODEL
      # NUXT_SESSION_SECRET
    env_file:
      - .env
    volumes:
      # Persist database
      - app-data:/app/data
      # Persist uploaded files
      - app-storage:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  app-data:
    driver: local
  app-storage:
    driver: local
